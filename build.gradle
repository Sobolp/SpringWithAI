plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'SpringWithAI'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

springBoot {
    // Generates META-INF/build-info.properties, exposed as the BuildProperties bean (used for the OpenAPI version).
    // The build time is left out so the file only changes when the project version does.
    buildInfo {
        excludes = ['time']
    }
}

configurations {
    mockitoAgent
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.spring.boot.h2console
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.validation
    implementation libs.spring.boot.starter.webmvc
    implementation libs.springdoc.openapi.webmvc.ui
    compileOnly libs.lombok
    developmentOnly libs.spring.boot.devtools
    runtimeOnly libs.h2
    annotationProcessor libs.lombok
    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testCompileOnly libs.lombok
    testRuntimeOnly libs.junit.platform.launcher
    testAnnotationProcessor libs.lombok
    mockitoAgent(libs.mockito.core) {
        transitive = false
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Load Mockito as a Java agent instead of letting it self-attach (blocked by default in future JDKs).
    // Resolved lazily, only when the test task actually runs.
    def mockitoAgent = configurations.mockitoAgent
    inputs.files(mockitoAgent).withPropertyName('mockitoAgent')
    jvmArgumentProviders.add({ ["-javaagent:${mockitoAgent.singleFile}".toString()] } as CommandLineArgumentProvider)
}
