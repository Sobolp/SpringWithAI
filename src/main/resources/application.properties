spring.application.name=SpringWithAI

# Seed dummy aliens (AlienDataLoader) only in the "dev" profile.
# "dev" is used when no profile is set; start with e.g. --spring.profiles.active=prod to skip seeding.
spring.profiles.default=dev

# Swagger UI and /v3/api-docs are off unless a profile turns them on. application-dev.properties does, and "dev"
# is the default profile, so they ARE served when no profile is set; start with --spring.profiles.active=prod to hide them.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Log to a rolling file as well as the console, so /actuator/logfile and the /logs page can read it.
# Rolls daily and at 10 MB, keeps 7 days, and caps all log files at 100 MB.
logging.file.name=logs/springwithai.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# Expose only these Actuator endpoints over HTTP. Anonymous health shows {"status":"UP"} and nothing more.
management.endpoints.web.exposure.include=health,logfile,loggers
management.endpoint.health.show-details=never
# No Kubernetes liveness/readiness groups: they would add "groups" to the public health response.
management.endpoint.health.probes.enabled=false
# But keep readiness in the overall status: 503 OUT_OF_SERVICE until startup (seeding included) has finished, so a
# load balancer sends no traffic before the app is ready. Without probes, Boot would otherwise report UP as soon as
# the web server is up.
management.health.readinessstate.enabled=true

# Until authentication exists, the log endpoints and /logs answer only loopback clients that ask for localhost
# (LocalhostOnlyLogAccessFilter; the Host check stops DNS rebinding). The check uses the socket address, so leave
# server.forward-headers-strategy unset: with it, an X-Forwarded-For header could make a remote caller look local.
app.logs.localhost-only=true
# A log level changed at runtime through /actuator/loggers reverts after this long.
app.logs.level-ttl=30m
